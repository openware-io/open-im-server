server:
 port: ${PORT:3300}

spring:
 config:
  import:
   - optional:file:.env[.properties]
   - optional:file:../.env[.properties]
 threads:
  virtual:
   enabled: false
 application:
  name: im-conversation-service
 datasource:
  url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:${DB_NAME:im_server}}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  username: ${DB_USERNAME:${DB_USER:root}}
  password: ${DB_PASSWORD:}
  driver-class-name: com.mysql.cj.jdbc.Driver
 data:
  redis:
   host: ${REDIS_HOST:localhost}
   port: ${REDIS_PORT:6379}
   database: ${REDIS_DB:0}
   password: ${REDIS_PASSWORD:}
 flyway:
  enabled: true
  locations: classpath:db/migration
  table: conversation_schema_history
  baseline-on-migrate: true
  baseline-version: 0
 jackson:
  default-property-inclusion: non_null

mybatis-plus:
 configuration:
  map-underscore-to-camel-case: true

jwt:
 secret: ${JWT_SECRET:}
 expiration-ms: ${JWT_EXPIRATION_MS:604800000}

internal:
  service-auth:
    service-name: ${INTERNAL_SERVICE_AUTH_SERVICE_NAME:im-conversation-service}
    expected-source: ${INTERNAL_SERVICE_AUTH_EXPECTED_SOURCE:im-admin-service,im-message-service,im-user-service}
    secret: ${INTERNAL_SERVICE_AUTH_SECRET}
    max-clock-skew-ms: ${INTERNAL_SERVICE_AUTH_MAX_CLOCK_SKEW_MS:60000}
    services:
      user:
        base-url: ${INTERNAL_USER_SERVICE_BASE_URL:http://im-user-service:3100}
      admin:
        base-url: ${INTERNAL_ADMIN_SERVICE_BASE_URL:http://im-admin-service:3400}

push:
 jpush:
  enabled: ${JPUSH_ENABLED:false}
  endpoint: ${JPUSH_ENDPOINT:https://api.jpush.cn/v3/push}
  app-key: ${JPUSH_APP_KEY:}
  master-secret: ${JPUSH_MASTER_SECRET:}
  apns-production: ${JPUSH_APNS_PRODUCTION:true}
  time-to-live-seconds: ${JPUSH_TIME_TO_LIVE_SECONDS:86400}

springdoc:
 api-docs:
  path: /api-docs
 paths-to-exclude: /internal/**
 swagger-ui:
  path: /swagger-ui.html

logging:
 file:
  name: ${LOG_FILE:${IM_OUTPUT_ROOT:.outputs}/logs/im-services/im-conversation-service/application.log}
 logback:
  rollingpolicy:
   file-name-pattern: ${LOG_FILE_PATTERN:${IM_OUTPUT_ROOT:.outputs}/logs/im-services/im-conversation-service/application.%d{yyyy-MM-dd}.%i.log.gz}
   max-file-size: 20MB
   max-history: 14
   total-size-cap: 2GB
 level:
  "[io.openware.im]": INFO
  "[org.springframework.web]": INFO

im:
  mq:
    type: ${IM_MQ_TYPE:REMOTING}
    namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
    producer-group: ${IM_CONVERSATION_SERVICE_MQ_PRODUCER_GROUP:im-conversation-service-producer}
    consumer-group-prefix: ${IM_MQ_CONSUMER_GROUP_PREFIX:${IM_MQ_DEFAULT_CONSUMER_GROUP_PREFIX:open_im}}
  conversation:
    outbox:
      relay-delay-ms: ${IM_CONVERSATION_OUTBOX_RELAY_DELAY_MS:1000}
    rtc:
      enabled: ${IM_CONVERSATION_RTC_ENABLED:false}
      turn-url: ${IM_CONVERSATION_RTC_TURN_URL:}
      turn-username: ${IM_CONVERSATION_RTC_TURN_USERNAME:}
      turn-password: ${IM_CONVERSATION_RTC_TURN_PASSWORD:}

management:
 info:
  env:
   enabled: true
 endpoints:
  web:
   exposure:
    include: health,info

info:
 release:
  git-commit: ${INFO_BUILD_GIT_COMMIT:unknown}
  image: ${INFO_BUILD_IMAGE:unknown}
  artifact-sha256: ${INFO_BUILD_ARTIFACT_SHA256:unknown}
