apiVersion: v1
kind: Service
metadata: { name: saas-mobile }
spec: { selector: { app: saas-mobile }, ports: [ { port: 80, targetPort: 80 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: saas-mobile }
spec:
  replicas: 1
  selector: { matchLabels: { app: saas-mobile } }
  template:
    metadata: { labels: { app: saas-mobile } }
    spec:
      imagePullSecrets: [ { name: acr-public-key } ]
      containers:
        - name: saas-mobile
          image: crpi-2xbf44rg544imbew.cn-hangzhou.personal.cr.aliyuncs.com/meta-cogni/saas-mobile:1.1.1
          imagePullPolicy: Always
          ports: [ { containerPort: 80 } ]
          readinessProbe: { httpGet: { path: /a380/index.html, port: 80 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /a380/index.html, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: miniservice }
spec:
  ingressClassName: nginx
  tls: [ { hosts: [ miniservice.dev.example.com, www.miniservice.dev.example.com ], secretName: miniservice-tls } ]
  rules:
    - host: miniservice.dev.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: saas-mobile, port: { number: 80 } } } }
    - host: www.miniservice.dev.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: saas-mobile, port: { number: 80 } } } }
