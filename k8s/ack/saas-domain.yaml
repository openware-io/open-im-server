apiVersion: v1
kind: Service
metadata: { name: platform-tenant-service }
spec: { selector: { app: platform-tenant-service }, ports: [ { port: 4110, targetPort: 4110 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: platform-tenant-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: platform-tenant-service } }
  template:
    metadata: { labels: { app: platform-tenant-service } }
    spec:
      imagePullSecrets: [ { name: acr-public-key } ]
      containers:
        - name: platform-tenant-service
          image: crpi-2xbf44rg544imbew.cn-hangzhou.personal.cr.aliyuncs.com/meta-cogni/platform-tenant-service:2.0.3
          imagePullPolicy: Always
          env:
            - { name: TZ, value: UTC }
            - { name: PORT, value: '4110' }
            - { name: MYSQL_HOST, value: mysql }
            - { name: MYSQL_USER, value: im_user }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: gv-im-secret, key: DB_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: gv-im-secret, key: JWT_SECRET } } }
            - { name: INTERNAL_SERVICE_AUTH_SECRET, valueFrom: { secretKeyRef: { name: gv-im-secret, key: INTERNAL_SERVICE_AUTH_SECRET } } }
          ports: [ { containerPort: 4110 } ]
          readinessProbe: { httpGet: { path: /actuator/health, port: 4110 }, initialDelaySeconds: 30, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 4110 }, initialDelaySeconds: 40, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 768Mi } }
---
