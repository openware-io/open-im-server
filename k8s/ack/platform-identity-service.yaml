apiVersion: v1
kind: Service
metadata: { name: platform-identity-service }
spec: { selector: { app: platform-identity-service }, ports: [ { port: 4100, targetPort: 4100 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: platform-identity-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: platform-identity-service } }
  template:
    metadata: { labels: { app: platform-identity-service } }
    spec:
      imagePullSecrets: [ { name: acr-public-key } ]
      containers:
        - name: platform-identity-service
          image: ghcr.io/openware-io/platform-identity-service:2.0.10
          imagePullPolicy: Always
          env:
            - { name: TZ, value: UTC }
            - { name: PORT, value: '4100' }
            - { name: MYSQL_HOST, value: mysql }
            - { name: MYSQL_USER, value: im_user }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-secret, key: DB_PASSWORD } } }
            - { name: IM_SERVICE_BASE_URL, value: http://im-user-service:3100 }
            - { name: TENANT_SERVICE_BASE_URL, value: http://platform-tenant-service:4110 }
            - { name: INTERNAL_SERVICE_AUTH_SECRET, valueFrom: { secretKeyRef: { name: open-im-secret, key: INTERNAL_SERVICE_AUTH_SECRET } } }
            - { name: JWT_SECRET, value: 80sA8SCmrQYcC6fvEtSQAmJBUNFkwZg3ICK91OqKjMQ }
            - { name: JWT_EXPIRATION_MS, value: '604800000' }
            - { name: ROCKETMQ_NAMESRV_ADDR, value: rocketmq-namesrv:9876 }
            - { name: IM_OAUTH_APP_ID, value: saas-a380-h5 }
            - { name: IM_OAUTH_APP_SECRET, value: saas-a380-h5-dev-secret }
            - { name: REDIS_HOST, value: 192.168.247.182 }
            - { name: REDIS_PORT, value: '6379' }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-secret, key: REDIS_PASSWORD } } }
          ports: [ { containerPort: 4100 } ]
          readinessProbe: { httpGet: { path: /actuator/health, port: 4100 }, initialDelaySeconds: 60, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 4100 }, initialDelaySeconds: 90, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 768Mi } }
