apiVersion: v1
kind: Service
metadata: { name: mysql }
spec: { selector: { app: mysql }, ports: [ { port: 3306, targetPort: 3306 } ] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql }
spec:
  serviceName: mysql
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: registry.example.com/openware/mysql:8.0
          imagePullPolicy: Always
          args: [ --max_connections=300 ]
          env:
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-secret, key: MYSQL_ROOT_PASSWORD } } }
            - { name: MYSQL_DATABASE, valueFrom: { secretKeyRef: { name: open-im-secret, key: DB_DATABASE } } }
            - { name: MYSQL_USER, valueFrom: { secretKeyRef: { name: open-im-secret, key: DB_USERNAME } } }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-secret, key: DB_PASSWORD } } }
          ports: [ { containerPort: 3306 } ]
          readinessProbe: { exec: { command: [sh, -c, 'mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD'] }, initialDelaySeconds: 20, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: '1', memory: 1Gi } }
          volumeMounts: [ { name: data, mountPath: /var/lib/mysql } ]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ ReadWriteOnce ], storageClassName: alicloud-disk-essd, resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app: redis }, ports: [ { port: 6379, targetPort: 6379 } ] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: registry.example.com/openware/redis:7-alpine
          imagePullPolicy: Always
          command: [sh, -c, 'redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"']
          env: [ { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-secret, key: REDIS_PASSWORD } } } ]
          ports: [ { containerPort: 6379 } ]
          readinessProbe: { exec: { command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping'] }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [ { name: data, mountPath: /data } ]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ ReadWriteOnce ], storageClassName: alicloud-disk-essd, resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: mongodb }
spec: { selector: { app: mongodb }, ports: [ { port: 27017, targetPort: 27017 } ] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongodb }
spec:
  serviceName: mongodb
  replicas: 1
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: registry.example.com/openware/mongo:7.0.12
          imagePullPolicy: Always
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, valueFrom: { secretKeyRef: { name: open-im-secret, key: MONGODB_USERNAME } } }
            - { name: MONGO_INITDB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-secret, key: MONGODB_PASSWORD } } }
          ports: [ { containerPort: 27017 } ]
          readinessProbe: { tcpSocket: { port: 27017 }, initialDelaySeconds: 15, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: '1', memory: 1Gi } }
          volumeMounts: [ { name: data, mountPath: /data/db } ]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ ReadWriteOnce ], storageClassName: alicloud-disk-essd, resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: minio }
spec: { selector: { app: minio }, ports: [ { name: api, port: 9000, targetPort: 9000 } ] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: minio }
spec:
  serviceName: minio
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: registry.example.com/openware/minio:RELEASE.2024-10-13T13-34-11Z
          imagePullPolicy: Always
          args: [server, /data]
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: open-im-secret, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-secret, key: MINIO_ROOT_PASSWORD } } }
          ports: [ { containerPort: 9000 } ]
          readinessProbe: { httpGet: { path: /minio/health/live, port: 9000 }, initialDelaySeconds: 15, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 1Gi } }
          volumeMounts: [ { name: data, mountPath: /data } ]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ ReadWriteOnce ], storageClassName: alicloud-disk-essd, resources: { requests: { storage: 50Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: rocketmq-namesrv }
spec: { selector: { app: rocketmq-namesrv }, ports: [ { port: 9876, targetPort: 9876 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rocketmq-namesrv }
spec:
  replicas: 1
  selector: { matchLabels: { app: rocketmq-namesrv } }
  template:
    metadata: { labels: { app: rocketmq-namesrv } }
    spec:
      containers: [ { name: namesrv, image: registry.example.com/openware/rocketmq@sha256:6ad88a43aece60f4974238fa6ac7be50e6a7347d6ac223f4182534ff12b67a91, command: [sh, mqnamesrv], ports: [ { containerPort: 9876 } ], resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: '1', memory: 768Mi } } } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: rocketmq-broker }
spec:
  serviceName: rocketmq-broker
  replicas: 1
  selector: { matchLabels: { app: rocketmq-broker } }
  template:
    metadata: { labels: { app: rocketmq-broker } }
    spec:
      initContainers:
        - name: prepare-store
          image: registry.example.com/openware/rocketmq@sha256:6ad88a43aece60f4974238fa6ac7be50e6a7347d6ac223f4182534ff12b67a91
          imagePullPolicy: Always
          command: [sh, -c, 'mkdir -p /home/rocketmq/store && chown -R 3000:3000 /home/rocketmq/store']
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          volumeMounts: [ { name: data, mountPath: /home/rocketmq/store } ]
      containers:
        - name: broker
          image: registry.example.com/openware/rocketmq@sha256:6ad88a43aece60f4974238fa6ac7be50e6a7347d6ac223f4182534ff12b67a91
          imagePullPolicy: Always
          command: [sh, mqbroker, -c, /home/rocketmq/conf/broker.conf]
          env: [ { name: JAVA_OPT_EXT, value: '-Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=128m' } ]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: '1', memory: 1Gi } }
          volumeMounts: [ { name: data, mountPath: /home/rocketmq/store }, { name: config, mountPath: /home/rocketmq/conf/broker.conf, subPath: broker.conf } ]
      volumes: [ { name: config, configMap: { name: rocketmq-broker-config } } ]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ ReadWriteOnce ], storageClassName: alicloud-disk-essd, resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: rocketmq-broker-config }
data:
  broker.conf: |
    brokerClusterName=DefaultCluster
    brokerName=broker-a
    brokerId=0
    namesrvAddr=rocketmq-namesrv:9876
    listenPort=10911
    autoCreateTopicEnable=true
    scheduleMessageDelayLevel=1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
    storePathRootDir=/home/rocketmq/store
    storePathCommitLog=/home/rocketmq/store/commitlog
