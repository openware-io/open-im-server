apiVersion: v1
kind: Service
metadata: { name: unified-portal }
spec: { selector: { app: unified-portal }, ports: [ { port: 80, targetPort: 80 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: unified-portal }
spec:
  replicas: 1
  selector: { matchLabels: { app: unified-portal } }
  template:
    metadata: { labels: { app: unified-portal } }
    spec:
      imagePullSecrets: [ { name: acr-public-key } ]
      containers:
        - name: unified-portal
          image: ghcr.io/openware-io/unified-portal:1.0.1
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80 } ]
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: im-admin }
spec:
  ingressClassName: nginx
  tls: [ { hosts: [ admin.dev.example.com ], secretName: admin.dev.example.com-tls } ]
  rules:
    - host: admin.dev.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: unified-portal, port: { number: 80 } } } }
          - { path: /api, pathType: Prefix, backend: { service: { name: gateway, port: { number: 3002 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: im-admin-im
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls: [ { hosts: [ admin.dev.example.com ], secretName: admin.dev.example.com-tls } ]
  rules:
    - host: admin.dev.example.com
      http:
        paths:
          - path: /im(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: pc-admin, port: { number: 80 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: im-admin-saas
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls: [ { hosts: [ admin.dev.example.com ], secretName: admin.dev.example.com-tls } ]
  rules:
    - host: admin.dev.example.com
      http:
        paths:
          - path: /saas(/|$)(.*)
            pathType: ImplementationSpecific
            backend: { service: { name: saas-admin, port: { number: 80 } } }
