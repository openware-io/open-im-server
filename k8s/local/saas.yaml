            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: '6379' }
            - { name: IDAAS_SERVICE_BASE_URL, value: http://group-idaas-service:4220 }
            - { name: IM_USER_SERVICE_BASE_URL, value: http://im-user-service:3100 }
            - { name: TENANT_SERVICE_BASE_URL, value: http://platform-tenant-service:4110 }
            - { name: INTERNAL_SERVICE_AUTH_EXPECTED_SOURCE, value: 'platform-tenant-service,platform-admin-service' }
            - { name: IDENTITY_SERVICE_BASE_URL, value: http://platform-identity-service:4100 }
            - { name: ORDER_SERVICE_BASE_URL, value: http://platform-order-service:4130 }
            - { name: RESOURCE_SERVICE_BASE_URL, value: http://platform-resource-service:4120 }
            - { name: PAYMENT_SERVICE_BASE_URL, value: http://common-payment-service:4140 }
            - { name: CUSTOMER_SERVICE_BASE_URL, value: http://platform-customer-service:4160 }
            # Kind 真机通过 HTTP 访问 SaaS 后台；管理端会话不能带 Secure，否则浏览器会丢弃。
            - { name: SAAS_COOKIE_PLAIN, value: 'true' }
