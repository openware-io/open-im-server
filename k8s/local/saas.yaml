apiVersion: apps/v1
kind: Deployment
metadata: { name: platform-identity-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: platform-identity-service } }
  template:
    metadata: { labels: { app: platform-identity-service } }
    spec:
      containers:
        - name: platform-identity-service
          image: __APP_IMAGE_PLATFORM_IDENTITY_SERVICE__
          imagePullPolicy: IfNotPresent
          envFrom: [ { secretRef: { name: open-im-env } } ]
          env:
            - { name: TZ, value: UTC }
            - { name: PORT, value: '4100' }
            - { name: MYSQL_HOST, value: mysql }
            - { name: MYSQL_USER, valueFrom: { secretKeyRef: { name: open-im-env, key: DB_USERNAME } } }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-env, key: DB_PASSWORD } } }
            - { name: REDIS_HOST, value: redis }
            - { name: IM_SERVICE_BASE_URL, value: http://im-user-service:3100 }
            - { name: TENANT_SERVICE_BASE_URL, value: http://platform-tenant-service:4110 }
            - { name: INTERNAL_SERVICE_AUTH_EXPECTED_SOURCE, value: 'platform-tenant-service,platform-admin-service,im-user-service' }
            # 局域网/本地调试放权（仅本地 Kind 清单）：允许内网来源用调试账号直接建立 H5 会话，
            # 绕开普通 http 内网地址下不可用的 PKCE。生产环境不设置这三个变量（默认关闭）。
            - { name: SAAS_DEV_SESSION_ENABLED, value: 'true' }
            - { name: SAAS_DEV_SESSION_CONSUMER_ACCOUNT_ID, value: '101' }
            - { name: SAAS_DEV_SESSION_OPERATOR_ACCOUNT_ID, value: '100' }
            - { name: INTERNAL_SERVICE_AUTH_SECRET, valueFrom: { secretKeyRef: { name: open-im-env, key: INTERNAL_SERVICE_AUTH_SECRET } } }
            - { name: ROCKETMQ_NAMESRV_ADDR, value: rocketmq-namesrv:9876 }
            # 本地 Kind 走 http(含真机 adb reverse 的 127.0.0.1):Android WebView 会丢弃 http 下 __Host-+Secure
            # Set-Cookie,必须用无前缀非 Secure 别名(saas_c_session),否则 C 端会话在真机上无法建立。
            - { name: SAAS_COOKIE_PLAIN, value: 'true' }
          ports: [ { containerPort: 4100 } ]
          readinessProbe: { httpGet: { path: /actuator/health, port: 4100 }, initialDelaySeconds: 30, periodSeconds: 5 }
---
