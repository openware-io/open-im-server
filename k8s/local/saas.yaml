          env:
            - { name: TZ, value: UTC }
            - { name: PORT, value: '4220' }
            - { name: MYSQL_HOST, value: mysql }
            - { name: MYSQL_DATABASE, value: open_im }
            - { name: MYSQL_USER, valueFrom: { secretKeyRef: { name: open-im-env, key: DB_USERNAME } } }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-env, key: DB_PASSWORD } } }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: '6379' }
            # 本地 Kind 使用 HTTP；Secure Cookie 会被浏览器丢弃，必须显式切换为同源 Lax Cookie。
            - { name: IDAAS_COOKIE_PLAIN, value: 'true' }
