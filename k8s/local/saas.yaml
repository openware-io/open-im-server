apiVersion: apps/v1
kind: Deployment
metadata: { name: common-audit-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: common-audit-service } }
  template:
    metadata: { labels: { app: common-audit-service } }
    spec:
      containers:
        - name: common-audit-service
          image: __APP_IMAGE_COMMON_AUDIT_SERVICE__
          imagePullPolicy: IfNotPresent
          envFrom: [ { secretRef: { name: open-im-env } } ]
          env:
            - { name: TZ, value: UTC }
            - { name: PORT, value: '4190' }
            - { name: MYSQL_HOST, value: mysql }
            - { name: MYSQL_USER, valueFrom: { secretKeyRef: { name: open-im-env, key: DB_USERNAME } } }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: open-im-env, key: DB_PASSWORD } } }
            # 审计存储切到独立 schema open_audit（月分区主表 + 幂等台账 + 归档清单），与 ACK 同一 profile。
            # 本地不需要手工建库：k8s/local/mysql-saas-init-job.yaml 已建出 open_audit 并授权。
            - { name: SPRING_PROFILES_ACTIVE, value: audit-schema }
            # 自留审计刻意不注入上报地址：本服务的上报目标就是自己，默认 http://localhost:4190
            # 直接进本 Pod 的 4190 端口；走 Service ClusterIP 回连自己会因 hairpin 以
            # ClosedChannelException 失败（本地 Kind 实测），自留审计会静默丢失。
          ports: [ { containerPort: 4190 } ]
          readinessProbe: { httpGet: { path: /actuator/health, port: 4190 }, initialDelaySeconds: 30, periodSeconds: 5 }
---
