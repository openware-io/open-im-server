apiVersion: v1
kind: Service
metadata: { name: mysql }
spec: { selector: { app: mysql }, ports: [ { port: 3306, targetPort: 3306 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql }
spec:
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          args: ["--max_connections=200"]
          env:
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: gv-im-env, key: DB_PASSWORD } } }
            - { name: MYSQL_DATABASE, valueFrom: { secretKeyRef: { name: gv-im-env, key: DB_DATABASE } } }
            - { name: MYSQL_USER, valueFrom: { secretKeyRef: { name: gv-im-env, key: DB_USERNAME } } }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: gv-im-env, key: DB_PASSWORD } } }
          ports: [ { containerPort: 3306 } ]
          readinessProbe: { exec: { command: [sh, -c, 'mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD'] }, initialDelaySeconds: 15, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: '1', memory: 768Mi } }
          volumeMounts: [ { name: data, mountPath: /var/lib/mysql } ]
      volumes: [ { name: data, emptyDir: {} } ]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app: redis }, ports: [ { port: 6379, targetPort: 6379 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'redis-server --requirepass "$REDIS_PASSWORD"']
          env: [ { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: gv-im-env, key: REDIS_PASSWORD } } } ]
          ports: [ { containerPort: 6379 } ]
          readinessProbe: { exec: { command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping'] }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: mongodb }
spec: { selector: { app: mongodb }, ports: [ { port: 27017, targetPort: 27017 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongodb }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0.12
          imagePullPolicy: IfNotPresent
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, valueFrom: { secretKeyRef: { name: gv-im-env, key: MONGODB_USERNAME } } }
            - { name: MONGO_INITDB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: gv-im-env, key: MONGODB_PASSWORD } } }
          ports: [ { containerPort: 27017 } ]
          readinessProbe: { tcpSocket: { port: 27017 }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: '1', memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: minio }
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-06-13T22-53-53Z
          imagePullPolicy: IfNotPresent
          args: [server, /data, --console-address, ':9001']
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: gv-im-env, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: gv-im-env, key: MINIO_ROOT_PASSWORD } } }
          ports: [ { containerPort: 9000 }, { containerPort: 9001 } ]
          readinessProbe: { httpGet: { path: /minio/health/live, port: 9000 }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [ { name: data, mountPath: /data } ]
      volumes: [ { name: data, emptyDir: {} } ]
---
apiVersion: v1
kind: Service
metadata: { name: rocketmq-namesrv }
spec: { selector: { app: rocketmq-namesrv }, ports: [ { port: 9876, targetPort: 9876 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rocketmq-namesrv }
spec:
  replicas: 1
  selector: { matchLabels: { app: rocketmq-namesrv } }
  template:
    metadata: { labels: { app: rocketmq-namesrv } }
    spec: { containers: [ { name: namesrv, image: gv-im/rocketmq:5.3.1-local, command: [sh, mqnamesrv], ports: [ { containerPort: 9876 } ], resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: '1', memory: 768Mi } } } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rocketmq-broker }
spec:
  replicas: 1
  selector: { matchLabels: { app: rocketmq-broker } }
  template:
    metadata: { labels: { app: rocketmq-broker } }
    spec:
      containers:
        - name: broker
          image: gv-im/rocketmq:5.3.1-local
          imagePullPolicy: IfNotPresent
          command: [sh, mqbroker, -n, rocketmq-namesrv:9876]
          env:
            - name: JAVA_OPT_EXT
              value: '-Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=128m'
          resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { cpu: '1', memory: 768Mi } }
