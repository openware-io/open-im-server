apiVersion: v1
kind: Service
metadata: { name: im-user-service }
spec: { selector: { app: im-user-service }, ports: [ { port: 3100, targetPort: 3100 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: im-user-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: im-user-service } }
  template:
    metadata: { labels: { app: im-user-service } }
    spec:
      containers:
        - name: im-user-service
          image: __APP_IMAGE_IM_USER_SERVICE__
          imagePullPolicy: IfNotPresent
          envFrom: [ { secretRef: { name: open-im-env } } ]
          env:
            - { name: TZ, value: UTC }
            - { name: PORT, value: '3100' }
            - { name: DB_HOST, value: mysql }
            - { name: DB_PORT, value: '3306' }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: '6379' }
            - { name: MONGODB_HOST, value: mongodb }
            - { name: MONGODB_PORT, value: '27017' }
            - { name: ROCKETMQ_NAMESRV_ADDR, value: rocketmq-namesrv:9876 }
            - { name: INTERNAL_MEDIA_SERVICE_BASE_URL, value: http://common-media-service:3600 }
            - { name: INTERNAL_SERVICE_AUTH_EXPECTED_SOURCE, value: 'im-admin-service,im-message-service,im-access-ws,im-conversation-service,platform-admin-service' }
          ports: [ { containerPort: 3100 } ]
          readinessProbe: &http3100 { httpGet: { path: /actuator/health, port: 3100 }, initialDelaySeconds: 30, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 3100 }, initialDelaySeconds: 90, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: im-conversation-service }
spec: { selector: { app: im-conversation-service }, ports: [ { port: 3300, targetPort: 3300 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: im-conversation-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: im-conversation-service } }
  template:
    metadata: { labels: { app: im-conversation-service } }
    spec:
      containers:
        - name: im-conversation-service
          image: __APP_IMAGE_IM_CONVERSATION_SERVICE__
          imagePullPolicy: IfNotPresent
          envFrom: [ { secretRef: { name: open-im-env } } ]
          env:
            - { name: TZ, value: UTC }
            - { name: PORT, value: '3300' }
            - { name: IM_CONVERSATION_RTC_ENABLED, value: "true" }
            - { name: IM_CONVERSATION_RTC_TURN_URL, value: "turn:turn.dev.example.com:3478?transport=udp,turn:turn.dev.example.com:3478?transport=tcp" }
            - name: IM_CONVERSATION_RTC_TURN_USERNAME
              valueFrom: { secretKeyRef: { name: open-chat-turn-credentials, key: TURN_USERNAME } }
            - name: IM_CONVERSATION_RTC_TURN_PASSWORD
              valueFrom: { secretKeyRef: { name: open-chat-turn-credentials, key: TURN_PASSWORD } }
            - { name: DB_HOST, value: mysql }
            - { name: DB_PORT, value: '3306' }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: '6379' }
            - { name: MONGODB_HOST, value: mongodb }
            - { name: MONGODB_PORT, value: '27017' }
            - { name: ROCKETMQ_NAMESRV_ADDR, value: rocketmq-namesrv:9876 }
          ports: [ { containerPort: 3300 } ]
          readinessProbe: &http3300 { httpGet: { path: /actuator/health, port: 3300 }, initialDelaySeconds: 30, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 3300 }, initialDelaySeconds: 90, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 768Mi } }
---
