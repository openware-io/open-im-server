apiVersion: v1
kind: Service
metadata: { name: im-access-ws }
spec: { selector: { app: im-access-ws }, ports: [ { port: 3001, targetPort: 3001 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: im-access-ws }
spec:
  replicas: 1
  selector: { matchLabels: { app: im-access-ws } }
  template:
    metadata: { labels: { app: im-access-ws } }
    spec:
      containers:
        - name: im-access-ws
          image: __APP_IMAGE_IM_ACCESS_WS__
          imagePullPolicy: IfNotPresent
          envFrom: [ { secretRef: { name: open-im-env } } ]
          env:
            - { name: TZ, value: UTC }
            - { name: PORT, value: '3001' }
            - { name: DB_HOST, value: mysql }
            - { name: DB_PORT, value: '3306' }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: '6379' }
            - { name: MONGODB_HOST, value: mongodb }
            - { name: MONGODB_PORT, value: '27017' }
            - { name: ROCKETMQ_NAMESRV_ADDR, value: rocketmq-namesrv:9876 }
            - { name: JPUSH_APNS_PRODUCTION, value: 'false' }
            - { name: IM_ACCESS_WS_ALLOWED_ORIGINS, value: 'http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:30080,http://localhost:30080' }
          ports: [ { containerPort: 3001 } ]
          readinessProbe: &tcp3001 { tcpSocket: { port: 3001 }, initialDelaySeconds: 30, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 3001 }, initialDelaySeconds: 90, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 768Mi } }
