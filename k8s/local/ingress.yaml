# All local application traffic enters through ingress-nginx. The controller
# is exposed on the Kind control-plane NodePort 30080 for LAN/mobile testing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-im-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 250m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: gateway, port: { number: 3002 } } } }
          - { path: /actuator, pathType: Prefix, backend: { service: { name: gateway, port: { number: 3002 } } } }
          - { path: /oauth, pathType: Prefix, backend: { service: { name: gateway, port: { number: 3002 } } } }
          - { path: /open, pathType: Prefix, backend: { service: { name: gateway, port: { number: 3002 } } } }
          - { path: /ws, pathType: Prefix, backend: { service: { name: im-access-ws, port: { number: 3001 } } } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-not-found
  namespace: open-im-local
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-not-found
  namespace: open-im-local
spec:
  replicas: 1
  selector: { matchLabels: { app: saas-not-found } }
  template:
    metadata: { labels: { app: saas-not-found } }
    spec:
      containers:
        - name: saas-not-found
          image: ghcr.io/openware-io/unified-portal:1.0.4-SNAPSHOT
          imagePullPolicy: IfNotPresent
          command: ['nginx', '-g', 'daemon off;']
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
          ports: [ { containerPort: 80 } ]
      volumes:
        - name: config
          configMap: { name: saas-not-found }
---
apiVersion: v1
kind: Service
metadata:
  name: saas-not-found
  namespace: open-im-local
spec:
  selector: { app: saas-not-found }
  ports: [ { port: 80, targetPort: 80 } ]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-im-portal
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /idaas, pathType: Prefix, backend: { service: { name: group-idaas-service, port: { number: 4220 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: unified-portal, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-im-admin-apps
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /im(/|$)(.*), pathType: ImplementationSpecific, backend: { service: { name: pc-admin, port: { number: 80 } } } }
          - { path: /saas(/|$)(.*), pathType: ImplementationSpecific, backend: { service: { name: saas-admin, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-im-mobile-apps
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /a380(/|$)(.*), pathType: ImplementationSpecific, backend: { service: { name: saas-not-found, port: { number: 80 } } } }
          - { path: /c(/|$)(.*), pathType: ImplementationSpecific, backend: { service: { name: saas-mobile, port: { number: 80 } } } }
          - { path: /website(/|$)(.*), pathType: ImplementationSpecific, backend: { service: { name: open-website, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-im-mobile-b
  annotations:
    # Keep the /b prefix: saas-mobile owns the B-end entry and its OAuth
    # callback at /b/. Rewriting to / would serve the C-end shell instead.
    nginx.ingress.kubernetes.io/rewrite-target: /b/$2
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /b(/|$)(.*), pathType: ImplementationSpecific, backend: { service: { name: saas-mobile, port: { number: 80 } } } }
