spring:
  datasource:
    url: jdbc:h2:mem:order_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    table: flyway_schema_history_order_test
    baseline-on-migrate: false
    baseline-version: 0
    locations: classpath:db/test-migration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
jwt:
  secret: 0123456789abcdef0123456789abcdef
platform:
  order:
    outbox:
      relay-delay-ms: 3600000

internal:
  service-auth:
    # 测试专用占位密钥：仅用于加载 Spring 上下文；生产不再提供默认值，必须由环境变量注入。
    secret: test-only-internal-service-secret
hotel:
  channel:
    # 单测/集成测试专用渠道凭证：仅 test profile 生效，生产与本地 Kind 由 env 注入。
    max-clock-skew-ms: 300000
    channels:
      sandbox:
        tenant-id: 9001
        secret: test-only-ota-channel-secret-0123456789abcdef
