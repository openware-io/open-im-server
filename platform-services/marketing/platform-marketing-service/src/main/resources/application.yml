spring:
  application:
    name: platform-marketing-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/open_saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: true
    table: flyway_schema_history_marketing
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
server:
  port: 4170
jwt:
  secret: ${JWT_SECRET:}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

im:
  mq:
    namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
    producer-group: ${PLATFORM_MARKETING_SERVICE_MQ_PRODUCER_GROUP:platform-marketing-service-producer}
platform:
  marketing:
    outbox:
      batch-size: ${PLATFORM_MARKETING_OUTBOX_BATCH_SIZE:100}
      relay-delay-ms: ${PLATFORM_MARKETING_OUTBOX_RELAY_DELAY_MS:1000}
      max-retry-count: ${PLATFORM_MARKETING_OUTBOX_MAX_RETRY_COUNT:10}
      base-retry-delay-seconds: ${PLATFORM_MARKETING_OUTBOX_BASE_RETRY_DELAY_SECONDS:1}
      max-backoff-seconds: ${PLATFORM_MARKETING_OUTBOX_MAX_BACKOFF_SECONDS:3600}

