spring:
  application:
    name: platform-customer-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/open_im?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: true
    table: flyway_schema_history_customer
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
server:
  port: 4160
jwt:
  secret: ${JWT_SECRET:}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  # 统一审计上报（AuditClient）。缺省值是集群内服务名；直接运行（本地直跑/Compose）时用
  # INTERNAL_AUDIT_SERVICE_BASE_URL=http://localhost:4190 覆盖。k8s/ACK 若不注入该环境变量，
  # 会退化成 SDK 默认的 http://localhost:4190，审计上报只在 WARN 里报错、静默丢失。
  audit-service:
    base-url: ${INTERNAL_AUDIT_SERVICE_BASE_URL:http://common-audit-service:4190}
  # 读取租户钱包代币展示配置（品牌名 + wallet_ratio）的内部端点：
  # GET /internal/iam/tenant-config/{tenantId}/wallet-token。缺省集群内服务名，
  # 本地直跑用 TENANT_SERVICE_BASE_URL=http://localhost:4110 覆盖。
  tenant-service:
    base-url: ${TENANT_SERVICE_BASE_URL:http://platform-tenant-service:4110}
# 出站内部调用签名（HMAC 鉴权版本 2）：secret 必须与 tenant-service 的
# INTERNAL_SERVICE_AUTH_SECRET 一致；tenant-service 的 INTERNAL_SERVICE_AUTH_EXPECTED_SOURCE
# 白名单必须包含 platform-customer-service，否则内部端点 401 → 代币品牌回退缺省 A380币（只打 WARN）。
internal:
  service-auth:
    service-name: ${INTERNAL_SERVICE_AUTH_SERVICE_NAME:platform-customer-service}
    secret: ${INTERNAL_SERVICE_AUTH_SECRET:}
# 客户姓名盲索引（cst_member_name_token）存量回填：姓名是随机 IV 密文，迁移里无法解密，
# 只能由应用层按「没有 token 行」的客户逐条解密重建（幂等、可重入，单条失败不中断整批）。
# 默认开启、30 分钟一轮；回填完成后可置 false 关掉，或调用
# POST /business/members/name-index/rebuild（权限 member.pii.view）人工触发。
member:
  name-index:
    rebuild-enabled: ${MEMBER_NAME_INDEX_REBUILD_ENABLED:true}
    rebuild-ms: ${MEMBER_NAME_INDEX_REBUILD_MS:1800000}
