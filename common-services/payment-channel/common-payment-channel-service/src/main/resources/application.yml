spring:
  application:
    name: common-payment-channel-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${SAAS_DATABASE:open_saas}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: true
    table: flyway_schema_history_payment_channel
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
server:
  port: 4180
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  # 渠道回调结算调用 payment-service 的内部接口：默认集群内服务名，本机直跑时用
  # PAYMENT_SERVICE_BASE_URL=http://localhost:4140 覆盖。
  payment-settlement:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://common-payment-service:4140}

internal:
  service-auth:
    # 出站内部签名身份：必须与 payment-service 侧 expected-source 白名单一致。
    service-name: ${INTERNAL_SERVICE_AUTH_SERVICE_NAME:common-payment-channel-service}
    # 必须与 payment-service 的 INTERNAL_SERVICE_AUTH_SECRET 一致（Kind 由 open-im-env secret 注入）。
    # 不提供默认值：缺失时启动即失败，避免带空密钥发请求后静默 401。
    secret: ${INTERNAL_SERVICE_AUTH_SECRET}

# 支付渠道密钥：全部来自环境占位（不硬编码真实密钥），enabled 决定渠道能力开关。
pay-channel-provider:
  wechat:
    enabled: ${WECHAT_PAY_ENABLED:false}
    app-id: ${WECHAT_PAY_APP_ID:}
    merchant-id: ${WECHAT_PAY_MCH_ID:}
    secret-key: ${WECHAT_PAY_SECRET_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    api-version: ${WECHAT_PAY_API_VERSION:v2}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    merchant-private-key: ${WECHAT_PAY_MCH_PRIVATE_KEY:}
    merchant-serial-no: ${WECHAT_PAY_MCH_SERIAL_NO:}
    platform-public-key: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:}
    platform-serial-no: ${WECHAT_PAY_PLATFORM_SERIAL_NO:}
  alipay:
    enabled: ${ALIPAY_PAY_ENABLED:false}
    app-id: ${ALIPAY_PAY_APP_ID:}
    merchant-private-key: ${ALIPAY_PAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PAY_PUBLIC_KEY:}
    notify-url: ${ALIPAY_PAY_NOTIFY_URL:}
    gateway-url: ${ALIPAY_PAY_GATEWAY:https://openapi.alipay.com/gateway.do}
  stripe:
    enabled: ${STRIPE_PAY_ENABLED:false}
    secret-key: ${STRIPE_PAY_SECRET_KEY:}
    webhook-secret: ${STRIPE_PAY_WEBHOOK_SECRET:}
    api-url: ${STRIPE_PAY_API_URL:https://api.stripe.com/v1}
    webhook-tolerance-seconds: ${STRIPE_PAY_WEBHOOK_TOLERANCE_SECONDS:300}
  # SANDBOX 渠道：仅本地 Kind E2E 使用（默认关闭，禁止在共享/生产环境启用）。
  # 用固定 HMAC 密钥对回调 JSON 验签，走与真实渠道完全相同的落账链路，使成功/失败/重复/退款回调可自动化验证。
  sandbox:
    enabled: ${SANDBOX_PAY_ENABLED:false}
    webhook-secret: ${SANDBOX_PAY_WEBHOOK_SECRET:}
