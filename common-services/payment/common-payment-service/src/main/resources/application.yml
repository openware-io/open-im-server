spring:
  application:
    name: common-payment-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/gv_saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: true
    table: flyway_schema_history_payment
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
server:
  port: 4140
jwt:
  secret: ${JWT_SECRET:}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

im:
  mq:
    namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
    producer-group: ${COMMON_PAYMENT_SERVICE_MQ_PRODUCER_GROUP:common-payment-service-producer}
    consumer-group-prefix: ${COMMON_PAYMENT_SERVICE_MQ_CONSUMER_GROUP_PREFIX:gv_im}
app:
  # 组合收款扣减储值/积分要回调 platform-customer-service 的内部端点。
  # 默认值与容器内一致（同 im-access-ws 的 http://im-user-service:3100 口径）；本机起服务时用
  # CUSTOMER_SERVICE_BASE_URL=http://localhost:4160 覆盖。缺这条映射会导致扣减走 localhost 而 500。
  customer-service:
    base-url: ${CUSTOMER_SERVICE_BASE_URL:http://platform-customer-service:4160}
  # 统一审计上报（AuditClient）。缺省值是集群内服务名；直接运行（本地直跑/Compose）时用
  # INTERNAL_AUDIT_SERVICE_BASE_URL=http://localhost:4190 覆盖。k8s/ACK 若不注入该环境变量，
  # 会退化成 SDK 默认的 http://localhost:4190，审计上报只在 WARN 里报错、静默丢失。
  audit-service:
    base-url: ${INTERNAL_AUDIT_SERVICE_BASE_URL:http://common-audit-service:4190}
platform:
  payment:
    outbox:
      batch-size: ${COMMON_PAYMENT_OUTBOX_BATCH_SIZE:100}
      relay-delay-ms: ${COMMON_PAYMENT_OUTBOX_RELAY_DELAY_MS:1000}
      max-retry-count: ${COMMON_PAYMENT_OUTBOX_MAX_RETRY_COUNT:10}
      base-retry-delay-seconds: ${COMMON_PAYMENT_OUTBOX_BASE_RETRY_DELAY_SECONDS:1}
      max-backoff-seconds: ${COMMON_PAYMENT_OUTBOX_MAX_BACKOFF_SECONDS:3600}
