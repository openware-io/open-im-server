services:
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7.0.12
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:?MONGODB_USERNAME must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?MONGODB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - mongodb_data:/data/db

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    command: sh mqbroker -n rocketmq-namesrv:9876
    depends_on:
      rocketmq-namesrv:
        condition: service_started

  im-user-service:
    image: ${OPEN_IMAGE_IM_USER_SERVICE:?Use deploy-docker.ps1 with ReleaseManifestPath}
    pull_policy: always
    environment: &service_environment
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_DB: ${REDIS_DB:-0}
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE must be set}
      MONGODB_USERNAME: ${MONGODB_USERNAME:?MONGODB_USERNAME must be set}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?MONGODB_PASSWORD must be set}
      MONGODB_AUTH_DATABASE: ${MONGODB_AUTH_DATABASE:-admin}
      ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      INTERNAL_SERVICE_AUTH_SECRET: ${INTERNAL_SERVICE_AUTH_SECRET:?INTERNAL_SERVICE_AUTH_SECRET must be set}
      INTERNAL_MEDIA_SERVICE_BASE_URL: http://common-media-service:3600
      JPUSH_ENABLED: ${JPUSH_ENABLED:-false}
      JPUSH_ENDPOINT: ${JPUSH_ENDPOINT:-https://api.jpush.cn/v3/push}
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}
      JPUSH_APNS_PRODUCTION: ${JPUSH_APNS_PRODUCTION:-true}
      JPUSH_TIME_TO_LIVE_SECONDS: ${JPUSH_TIME_TO_LIVE_SECONDS:-86400}
    depends_on: &application_dependencies
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    healthcheck: &application_healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT:-3100}/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  im-message-service:
    image: ${OPEN_IMAGE_IM_MESSAGE_SERVICE:?Use deploy-docker.ps1 with ReleaseManifestPath}
    pull_policy: always
    environment:
      <<: *service_environment
      PORT: 3200
      IM_USER_SERVICE_BASE_URL: http://im-user-service:3100
      IM_CONVERSATION_SERVICE_BASE_URL: http://im-conversation-service:3300
      IM_ADMIN_SERVICE_BASE_URL: http://im-admin-service:3400
    depends_on:
      <<: *application_dependencies
      mongodb:
        condition: service_healthy
    healthcheck: *application_healthcheck

  im-conversation-service:
    image: ${OPEN_IMAGE_IM_CONVERSATION_SERVICE:?Use deploy-docker.ps1 with ReleaseManifestPath}
    pull_policy: always
    environment:
      <<: *service_environment
      PORT: 3300
    depends_on: *application_dependencies
    healthcheck: *application_healthcheck

  common-media-service:
    image: ${OPEN_IMAGE_COMMON_MEDIA_SERVICE:?Use deploy-docker.ps1 with ReleaseManifestPath}
    pull_policy: always
    environment:
      <<: *service_environment
      PORT: 3600
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-minio}
      MEDIA_INTERNAL_ENDPOINT: http://minio:9000
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://127.0.0.1:9000}
      MEDIA_REGION: ${MEDIA_REGION:-us-east-1}
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:-local-minio-access-key}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:-change-me-local-minio-secret}
      MEDIA_PRIVATE_BUCKET: ${MEDIA_PRIVATE_BUCKET:-im-local-private}
    depends_on: *application_dependencies
    healthcheck: *application_healthcheck

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    profiles: [media-local]
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://127.0.0.1:5173,http://localhost:5173}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-05-28T17-19-04Z
    profiles: [media-local]
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done &&
      mc mb --ignore-existing local/${MEDIA_PRIVATE_BUCKET:-im-local-private}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio-secret}

  im-admin-service:
    image: ${OPEN_IMAGE_IM_ADMIN_SERVICE:?Use deploy-docker.ps1 with ReleaseManifestPath}
    pull_policy: always
    environment:
      <<: *service_environment
      PORT: 3400
      INTERNAL_USER_SERVICE_BASE_URL: http://im-user-service:3100
      INTERNAL_MESSAGE_SERVICE_BASE_URL: http://im-message-service:3200
      INTERNAL_CONVERSATION_SERVICE_BASE_URL: http://im-conversation-service:3300
    depends_on: *application_dependencies
    healthcheck: *application_healthcheck

  im-access-ws:
    image: ${OPEN_IMAGE_IM_ACCESS_WS:?Use deploy-docker.ps1 with ReleaseManifestPath}
    pull_policy: always
    environment:
      <<: *service_environment
      PORT: 3001
      IM_ACCESS_WS_ALLOWED_ORIGINS: ${IM_ACCESS_WS_ALLOWED_ORIGINS:?IM_ACCESS_WS_ALLOWED_ORIGINS must be set}
    depends_on:
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started

  gateway:
    image: ${OPEN_IMAGE_GATEWAY:?Use deploy-docker.ps1 with ReleaseManifestPath}
    pull_policy: always
    ports:
      - "${GATEWAY_PORT:-3002}:3002"
    environment:
      PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      IM_DOCUMENTATION_USERNAME: ${IM_DOCUMENTATION_USERNAME:?IM_DOCUMENTATION_USERNAME must be set}
      IM_DOCUMENTATION_PASSWORD: ${IM_DOCUMENTATION_PASSWORD:?IM_DOCUMENTATION_PASSWORD must be set}
      IM_USER_URI: http://im-user-service:3100
      IM_MESSAGE_URI: http://im-message-service:3200
      IM_CONVERSATION_URI: http://im-conversation-service:3300
      IM_ADMIN_URI: http://im-admin-service:3400
      COMMON_MEDIA_URI: http://common-media-service:3600
      IM_ACCESS_WS_URI: ws://im-access-ws:3001
      IM_GATEWAY_ALLOWED_ORIGINS: ${IM_GATEWAY_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      im-user-service:
        condition: service_healthy
      im-message-service:
        condition: service_healthy
      im-conversation-service:
        condition: service_healthy
      common-media-service:
        condition: service_healthy
      im-admin-service:
        condition: service_healthy
      im-access-ws:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  mongodb_data:
  minio_data:
