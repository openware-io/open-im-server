# Build & push all backend service images to ghcr.io/openware-io.
# Trigger: push a version tag, e.g.  git tag v2.1.0 && git push origin v2.1.0
name: publish-images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: openware-io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven package
        run: ./mvnw -B -T 1C clean package -DskipTests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          # image-name -> maven module directory
          services=$(cat <<'EOF'
          im-user-service:im-services/user/im-user-service
          im-message-service:im-services/message/im-message-service
          im-conversation-service:im-services/conversation/im-conversation-service
          im-admin-service:im-services/admin/im-admin-service
          common-media-service:common-services/media/common-media-service
          im-access-ws:gateways/im-access-ws
          gateway:gateways/gateway
          platform-customer-service:platform-services/customer/platform-customer-service
          platform-identity-service:platform-services/identity/platform-identity-service
          platform-admin-service:platform-services/admin/platform-admin-service
          platform-tenant-service:platform-services/tenant/platform-tenant-service
          platform-resource-service:platform-services/resource/platform-resource-service
          platform-order-service:platform-services/order/platform-order-service
          common-audit-service:common-services/audit/common-audit-service
          common-payment-service:common-services/payment/common-payment-service
          common-payment-channel-service:common-services/payment-channel/common-payment-channel-service
          common-sms-service:common-services/sms/common-sms-service
          common-mail-service:common-services/mail/common-mail-service
          platform-marketing-service:platform-services/marketing/platform-marketing-service
          group-idaas-service:group-services/idaas/group-idaas-service
          EOF
          )
          echo "$services" | while IFS=: read -r name mod; do
            [ -z "$name" ] && continue
            jar=$(ls "$mod"/target/*.jar 2>/dev/null | grep -v original | head -1 || true)
            if [ -z "$jar" ]; then echo "::warning::no jar for $name"; continue; fi
            image="${REGISTRY}/${ORG}/${name}"
            echo "==> building $image:$TAG from $jar"
            docker buildx build \
              --platform linux/amd64 \
              --build-arg JAR_PATH="$jar" \
              --build-arg IMAGE_VERSION="$TAG" \
              --build-arg IMAGE_REVISION="${GITHUB_SHA}" \
              --build-arg IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --build-arg IMAGE_SOURCE="https://github.com/${{ github.repository }}" \
              -t "${image}:${TAG}" \
              -t "${image}:latest" \
              --push .
          done
